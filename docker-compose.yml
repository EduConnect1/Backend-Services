version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: learngeeks-postgres
    environment:
      POSTGRES_DB: leengeeks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: learngeeks-backend
    ports:
      - "10000:10000"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leengeeks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123

volumes:
  pgdata:
